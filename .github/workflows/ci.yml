name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# Pull requests cancel their older runs. Pushes to main queue instead, so every commit on main gets a verdict. GitHub
# rejects queue: max beside cancel-in-progress: true, so the queue follows the event too.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

jobs:
  # Pull requests that change only site/, docs/, .github/ISSUE_TEMPLATE/ or the Markdown at the root skip the rust and
  # swift jobs. Merge groups and pushes to main run every job, so each commit a release tags has passed them all.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - name: Check whether the app or the core changed
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          app=true
          if [[ $EVENT == pull_request ]]; then
            compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD")
            # The compare API lists at most 300 files; a longer list runs everything.
            if (($(jq '.files | length' <<< "$compare") < 300)); then
              app=false
              while IFS= read -r path; do
                case $path in
                  # MainMenuTests checks the keyboard pages, and the app bundles these two.
                  docs/keyboard.md | site/docs/keyboard/* | CHANGELOG.md | THIRD_PARTY_NOTICES.md) app=true ;;
                  site/* | docs/* | .github/ISSUE_TEMPLATE/*) ;;
                  */*) app=true ;;
                  *.md) ;;
                  *) app=true ;;
                esac
              done < <(jq -r '.files[] | .filename, (.previous_filename // empty)' <<< "$compare")
            fi
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      # v1: the v0 entries hold no build for the doctests, whose dependencies resolve without dewline-ffi's features,
      # and an exact hit is never saved again.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core -> target
          prefix-key: v1-rust
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked
      # nextest runs no doctests.
      - run: cargo test --doc --workspace --locked

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --manifest-path core/Cargo.toml check

  swift:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    # One cached target dir for the FFI library and the dewline command that embed-cli.sh builds.
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/core/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen 2.46.0
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      # The engine build (xcframework, Swift bindings, dewline command), keyed on every input it reads. A pull request
      # whose key main has saved skips Rust. Main always builds from source and fails if that differs from the entry
      # saved under the same key. The merge queue always builds from source.
      - id: core-key
        run: |
          inputs=$({ git ls-files -s core scripts/build-xcframework.sh scripts/embed-cli.sh app/project.yml; env | grep -E '^(RUSTFLAGS|CARGO_|MACOSX_)' | sort; } | shasum | cut -c1-40)
          echo "key=core-$ImageVersion-$inputs" >> "$GITHUB_OUTPUT"
      - id: core
        if: github.event_name != 'merge_group'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/core-artifacts
          key: ${{ steps.core-key.outputs.key }}
      - if: github.event_name == 'pull_request' && steps.core.outputs.cache-hit == 'true'
        run: |
          cp -R "$RUNNER_TEMP/core-artifacts/DewlineFFI.xcframework" Packages/MdCore/
          mkdir -p Packages/MdCore/Sources
          cp -R "$RUNNER_TEMP/core-artifacts/DewlineFFIBindings" Packages/MdCore/Sources/
      - if: github.event_name != 'pull_request' || steps.core.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - if: github.event_name != 'pull_request' || steps.core.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core -> target
          shared-key: ffi
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Host slice only: release-dry builds and checks the universal app on main.
      - if: github.event_name != 'pull_request' || steps.core.outputs.cache-hit != 'true'
        run: scripts/build-xcframework.sh
      - run: xcodegen generate --spec app/project.yml
      # Xcode's compilation cache, keyed on the tracked sources and the runner image. Main builds it from empty and saves
      # it; pull requests restore the newest one; the merge queue builds without it.
      - id: cas
        run: |
          echo "prefix=xcode-cas-$ImageVersion-" >> "$GITHUB_OUTPUT"
          echo "key=xcode-cas-$ImageVersion-$(git ls-files -s app Packages core | shasum | cut -c1-40)" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/xcode-cas
          key: ${{ steps.cas.outputs.key }}
          restore-keys: ${{ steps.cas.outputs.prefix }}
      # Pull requests build the packages for the host only; the merge queue and main still build them for arm64 and x86_64.
      - run: xcodebuild test -project app/Dewline.xcodeproj -scheme Dewline -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO $ARCH $CACHE
        env:
          ARCH: ${{ github.event_name == 'pull_request' && 'ONLY_ACTIVE_ARCH=YES' || '' }}
          DEWLINE_CLI: ${{ github.event_name == 'pull_request' && steps.core.outputs.cache-hit == 'true' && format('{0}/core-artifacts/dewline', runner.temp) || '' }}
          CACHE: ${{ github.event_name != 'merge_group' && format('COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH={0}/xcode-cas', runner.temp) || '' }}
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/xcode-cas
          key: ${{ steps.cas.outputs.key }}
      - name: Check the engine build against main's entry for the same key
        if: github.event_name == 'push'
        env:
          HIT: ${{ steps.core.outputs.cache-hit }}
        run: |
          built=$RUNNER_TEMP/core-built
          mkdir "$built"
          cp -R Packages/MdCore/DewlineFFI.xcframework Packages/MdCore/Sources/DewlineFFIBindings "$built/"
          cp "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/dewline" "$built/"
          if [[ $HIT == true ]]; then
            diff -r "$RUNNER_TEMP/core-artifacts" "$built" || { echo "::error::the engine built from source differs from the cached build under the same key, so the key misses an input"; exit 1; }
          else
            rm -rf "$RUNNER_TEMP/core-artifacts"
            mv "$built" "$RUNNER_TEMP/core-artifacts"
          fi
      - if: github.event_name == 'push' && steps.core.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/core-artifacts
          key: ${{ steps.core-key.outputs.key }}

  # The release path with no secrets: the universal app from pinned inputs, its Mach-O and Info.plist checks, its DMG
  # signed ad hoc, and a feed signed with a key made for this run and checked by scripts/verify-feed.sh. Runs on main
  # and in the merge queue, not on pull requests.
  release-dry:
    if: github.event_name != 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install XcodeGen 2.46.0
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build the universal app and check it
        run: scripts/build-release.sh "$RUNNER_TEMP/release"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install dmgbuild 2.0.0
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet --disable-pip-version-check --require-hashes --no-deps --only-binary :all: -r scripts/dmg/requirements.txt
          echo "$RUNNER_TEMP/dmgbuild/bin" >> "$GITHUB_PATH"
      - name: Package it and sign a feed with a throwaway key
        run: scripts/release-dry.sh "$RUNNER_TEMP/release/Dewline.app" "$RUNNER_TEMP/dry"

  landmines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/landmines.sh

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.30.1
          advanced-security: false

  # Every job must succeed. Only a pull request may skip: rust and swift when changes found no app or core change, and
  # release-dry always.
  required:
    if: always()
    needs: [changes, rust, deny, swift, release-dry, landmines, zizmor]
    runs-on: ubuntu-latest
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          APP: ${{ needs.changes.outputs.app }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          results=$(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS")
          status=0
          while read -r job result; do
            case $EVENT/$job/$APP in
              pull_request/rust/false | pull_request/swift/false | pull_request/release-dry/*) may_skip=true ;;
              *) may_skip=false ;;
            esac
            if [[ $result == success || ($result == skipped && $may_skip == true) ]]; then
              echo "$job: $result"
            else
              echo "::error::$job ended $result on $EVENT"
              status=1
            fi
          done <<< "$results"
          exit $status
