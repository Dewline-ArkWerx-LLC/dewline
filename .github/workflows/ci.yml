name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  # Pull requests and merge groups that change only site/, docs/, .github/ISSUE_TEMPLATE/ or the Markdown at the root
  # skip the rust and swift jobs. Pushes to main run every job, so each commit a release tags has passed them all.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - name: Check whether the app or the core changed
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          app=true
          if [[ $EVENT != push ]]; then
            compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD")
            # The compare API lists at most 300 files; a longer list runs everything.
            if (($(jq '.files | length' <<< "$compare") < 300)); then
              app=false
              while IFS= read -r path; do
                case $path in
                  # MainMenuTests checks the keyboard pages, and the app bundles these two.
                  docs/keyboard.md | site/docs/keyboard/* | CHANGELOG.md | THIRD_PARTY_NOTICES.md) app=true ;;
                  site/* | docs/* | .github/ISSUE_TEMPLATE/*) ;;
                  */*) app=true ;;
                  *.md) ;;
                  *) app=true ;;
                esac
              done < <(jq -r '.files[] | .filename, (.previous_filename // empty)' <<< "$compare")
            fi
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core -> target
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --manifest-path core/Cargo.toml check

  swift:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    # One cached target dir for the FFI library and the dewline command that embed-cli.sh builds.
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/core/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen 2.46.0
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core -> target
          shared-key: ffi
      # Host slice only: release-dry builds and checks the universal app on main.
      - run: scripts/build-xcframework.sh
      - run: xcodegen generate --spec app/project.yml
      - run: xcodebuild test -project app/Dewline.xcodeproj -scheme Dewline -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO

  # The release path with no secrets: the universal app from pinned inputs, its Mach-O and Info.plist checks, its DMG
  # signed ad hoc, and a feed signed with a key made for this run and checked by scripts/verify-feed.sh. Runs on main,
  # not on pull requests.
  release-dry:
    if: github.event_name == 'push'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install XcodeGen 2.46.0
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build the universal app and check it
        run: scripts/build-release.sh "$RUNNER_TEMP/release"
      - name: Package it and sign a feed with a throwaway key
        run: scripts/release-dry.sh "$RUNNER_TEMP/release/Dewline.app" "$RUNNER_TEMP/dry"

  landmines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/landmines.sh

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.30.1
          advanced-security: false

  required:
    if: always()
    needs: [changes, rust, deny, swift, release-dry, landmines, zizmor]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a required job ended: $result"; exit 1 ;;
            esac
          done
