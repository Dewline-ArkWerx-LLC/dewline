name: nightly

# What pull requests skip, once a day on main: each cargo-fuzz target for 10 minutes, the workspace tests in release
# with 10,000 proptest cases, merge3's survey against git merge-file, and the latest Claude Code and Codex run over
# scripts/agent-conformance.sh's notes. A step whose files are not on the commit is skipped. A fuzz crash becomes a
# private advisory (SECURITY.md), so the fuzzer's output and inputs stay on the runner and the job prints the SHA-256
# of each input it left.
on:
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: core

jobs:
  fuzz:
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        if: hashFiles('core/fuzz/Cargo.toml') != ''
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - name: Install cargo-fuzz 0.13.2
        if: hashFiles('core/fuzz/Cargo.toml') != ''
        run: cargo install --locked cargo-fuzz@0.13.2
      - name: Build the fuzz targets
        if: hashFiles('core/fuzz/Cargo.toml') != ''
        run: cargo fuzz build
      - name: Fuzz each target for 10 minutes
        if: hashFiles('core/fuzz/Cargo.toml') != ''
        run: |
          targets=$(cargo fuzz list)
          [[ -n $targets ]] || { echo "::error::cargo fuzz list reports no targets"; exit 1; }
          status=0
          for target in $targets; do
            # The fuzzer prints a failing input, so its output goes to a file that is never uploaded.
            code=0
            cargo fuzz run "$target" -- -max_total_time=600 -timeout=60 > "$RUNNER_TEMP/fuzz-$target.log" 2>&1 || code=$?
            if ((code == 0)); then
              echo "$target: $(tail -n 1 "$RUNNER_TEMP/fuzz-$target.log")"
            else
              echo "::error::fuzz target $target exited $code"
              status=1
            fi
            for input in "fuzz/artifacts/$target"/*; do
              [[ -f $input ]] || continue
              echo "::error::fuzz target $target left ${input##*/}, SHA-256 $(shasum -a 256 "$input" | cut -d' ' -f1)"
              status=1
            done
          done
          exit "$status"

  proptest:
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - name: Workspace tests in release with 10,000 proptest cases
        env:
          PROPTEST_CASES: 10000
        run: cargo test --workspace --release --locked --no-fail-fast
      - name: Survey merge3 against git merge-file and fail on glue
        if: hashFiles('core/crates/core/tests/merge_vs_git.rs') != ''
        env:
          MERGE_CHECK_CASES: 12000
          MERGE_CHECK_MODES: lf,cr
        run: |
          survey=$RUNNER_TEMP/survey.txt
          cargo test --workspace --release --locked --test merge_vs_git -- --ignored --exact survey --nocapture | tee "$survey"
          [[ $(grep -c '^finding counts:' "$survey") == 2 ]] || { echo "::error::the survey did not report both modes"; exit 1; }
          if grep '^finding counts:.*Glued' "$survey"; then
            echo "::error::merge3 glued text from both sides together; the survey above lists the triples"
            exit 1
          fi

  # Each agent runs only when its API key secret is set; the script skips one without it.
  agents:
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - name: Build the dewline command
        run: cargo build -p dewline-cli --locked
      - name: Run Claude Code and Codex over the conformance notes
        working-directory: .
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: | # zizmor: ignore[adhoc-packages] the run tests the latest releases
          packages=()
          [[ -n $ANTHROPIC_API_KEY ]] && packages+=(@anthropic-ai/claude-code)
          [[ -n $OPENAI_API_KEY ]] && packages+=(@openai/codex)
          if ((${#packages[@]} > 0)); then
            npm install --global "${packages[@]}"
          fi
          scripts/agent-conformance.sh core/target/debug/dewline

  # A failure on main opens an issue, or comments on the one still open, with a link to the run. The run's logs hold
  # the details; a fuzz crash's inputs stay on the runner as above.
  report:
    needs: [fuzz, proptest, agents]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # opens the nightly issue or comments on it
    steps:
      - name: Open or update the nightly issue
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FUZZ: ${{ needs.fuzz.result }}
          PROPTEST: ${{ needs.proptest.result }}
          AGENTS: ${{ needs.agents.result }}
          SHA: ${{ github.sha }}
        run: |
          title="Nightly fails on main"
          body="$(date -u +%F): fuzz $FUZZ, proptest $PROPTEST, agents $AGENTS at $SHA. $RUN"
          number=$(gh issue list --state open --author app/github-actions --search "in:title \"$title\"" \
            --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [[ -n $number ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
