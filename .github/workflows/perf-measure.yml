name: perf-measure

# Temporary: measures W6 on the CI runner (folderWindow, opening, typing, keystroke parts). Deleted before merge.
on:
  push:
    branches: [w3/l4]

permissions:
  contents: read

jobs:
  measure:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      CARGO_TARGET_DIR: ${{ github.workspace }}/core/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen 2.46.0
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - run: scripts/build-xcframework.sh
      - run: xcodegen generate --spec app/project.yml
      - name: Build
        run: |
          xcodebuild build-for-testing -project app/Dewline.xcodeproj -scheme Dewline -configuration Test \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO -quiet
      - name: Measure three times
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize; sw_vers -productVersion
          for n in 1 2 3; do
            out=$RUNNER_TEMP/perf-$n.json
            TEST_RUNNER_DEWLINE_PERF=1 TEST_RUNNER_DEWLINE_PERF_OUT=$out xcodebuild test-without-building -project app/Dewline.xcodeproj \
              -scheme Dewline -configuration Test -destination 'platform=macOS,arch=arm64' -derivedDataPath "$RUNNER_TEMP/dd" \
              CODE_SIGNING_ALLOWED=NO -quiet '-only-testing:DewlineTests/PerfTests/folderWindow()' \
              '-only-testing:DewlineTests/PerfTests/opening()' '-only-testing:DewlineTests/PerfTests/typing()' || true
            jq -c --arg n "$n" '{run: $n, folderWindow, open1MB, open10MB, keystroke1MB, keystroke10MB}' "$out" | sed 's/^/PERF /' | tee -a "$GITHUB_STEP_SUMMARY"
            lat=$RUNNER_TEMP/lat-$n.json
            TEST_RUNNER_DEWLINE_LATENCY=1 TEST_RUNNER_DEWLINE_LATENCY_OUT=$lat xcodebuild test-without-building -project app/Dewline.xcodeproj \
              -scheme Dewline -configuration Test -destination 'platform=macOS,arch=arm64' -derivedDataPath "$RUNNER_TEMP/dd" \
              CODE_SIGNING_ALLOWED=NO -quiet '-only-testing:DewlineTests/KeystrokeLatency/parts()' || true
            jq -c -s -f perf/keystroke-parts.jq "$lat" | sed 's/^/PARTS /' | tee -a "$GITHUB_STEP_SUMMARY"
          done

