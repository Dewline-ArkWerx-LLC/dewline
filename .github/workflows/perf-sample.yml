name: perf-sample

# Temporary: samples nightly.yml's perf job five times on main's app code, and runs its collab job, on the CI runner.
# Deleted before merge.
on:
  push:
    branches: [w4/l4]

permissions:
  contents: read

jobs:
  perf:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5]
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      CARGO_TARGET_DIR: ${{ github.workspace }}/core/target
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen 2.46.0
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - run: scripts/build-xcframework.sh
      - run: xcodegen generate --spec app/project.yml
      - name: Measure a folder window with tabs and a 10 MB note
        env:
          N: ${{ matrix.run }}
        run: |
          out=$RUNNER_TEMP/perf-ci.json
          TEST_RUNNER_DEWLINE_PERF=1 TEST_RUNNER_DEWLINE_PERF_OUT=$out xcodebuild test -project app/Dewline.xcodeproj -scheme Dewline \
            -configuration Test -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO -quiet \
            '-only-testing:DewlineTests/PerfTests/folderWindow()'
          jq .folderWindow "$out"
          jq -c --arg n "$N" '{run: $n} + .folderWindow' "$out" | sed 's/^/PERF /' | tee -a "$GITHUB_STEP_SUMMARY"

  collab:
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/core/target
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen 2.46.0
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - run: COLLAB=1 scripts/build-xcframework.sh
      - run: xcodegen generate --spec app/project.yml
      - run: |
          xcodebuild build-for-testing -project app/Dewline.xcodeproj -scheme Dewline -configuration Test \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO 'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) COLLAB'

