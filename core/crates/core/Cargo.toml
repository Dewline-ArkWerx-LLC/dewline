[package]
name = "dewline-core"
description = "The Dewline engine: it owns the bytes of every open file."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "dewline_core"

[dependencies]
blake3 = "=1.8.7"
flate2 = "=1.1.10"
imara-diff = { version = "=0.2.0", default-features = false }
libc = "=0.2.191"
pulldown-cmark = { version = "=0.13.6", default-features = false }
regex = "=1.13.1"
serde_json = "=1.0.154"
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-onig", "dump-load"] }
unicase = "=2.10.0"
zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2"] }
zstd = { version = "=0.14.3", default-features = false }

[dev-dependencies]
proptest = "=1.12.0"
tempfile = "=3.27.0"
