[package]
name = "syntaxes"
description = "Writes app/Dewline/Syntaxes.packdump, the code syntaxes core::highlight loads, from two-face. A build tool; nothing here ships."
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-onig", "dump-load", "dump-create"] }
# bat 0.26.1's syntaxes. Moving it changes the dump: rerun the script, the tests and scripts/notices.sh.
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-onig"] }

[workspace]
